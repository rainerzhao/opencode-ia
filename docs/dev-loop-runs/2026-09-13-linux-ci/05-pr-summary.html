<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux 持续验证</title><style>body{font:16px/1.7 system-ui;max-width:850px;margin:40px auto;padding:0 24px;color:#172033}</style><h1>Linux 持续验证</h1><p>公开仓库每次代码提交运行真实 MySQL/TLS 回归与 Linux 镜像检查，不需要公司模型密钥。</p><p>工作流使用只读权限和固定 Action SHA。镜像在断网容器内验证非 root、前端资源、持久目录及排除项。</p><p>首次 CI 结果见<a href="04-acceptance-report.md">验收报告</a>；公司预发布和生产验收仍独立进行。</p></html>
