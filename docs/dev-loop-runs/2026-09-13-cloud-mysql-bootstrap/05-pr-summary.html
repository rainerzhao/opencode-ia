<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云 MySQL 首次管理员初始化</title><style>body{font:16px/1.7 system-ui;max-width:850px;margin:40px auto;padding:0 24px;color:#172033}section{margin:24px 0}</style><h1>云 MySQL 首次管理员初始化</h1><p>管理员 CLI 使用工作台同一数据库配置，首次部署创建的账号可以直接登录生产服务。</p><section><h2>行为</h2><p>检查数据库能力、迁移、加锁初始化。两个初始化进程只有一个成功，账号与审计同事务。配置错误或 MySQL 不可达时不生成 SQLite 备用账号。</p></section><section><h2>验证</h2><p>真实 CLI、MySQL 和 HTTP/WebSocket 定向验收 10/10 通过；完整回归结果见验收报告。</p></section><section><h2>上线边界</h2><p>本次只关闭首次管理员入口问题；公司云数据库 TLS、Linux 构建和内部 Provider 等验收继续进行。</p></section><p><a href="04-acceptance-report.md">验收报告</a></p></html>
