<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云数据库 TLS 与恢复</title><style>body{font:16px/1.7 system-ui;max-width:850px;margin:40px auto;padding:0 24px;color:#172033}section{margin:24px 0}</style><h1>云数据库 TLS 与恢复</h1><p>应用、管理员和备份恢复共用内部 CA 与数据库主机名验证。</p><section><h2>交付</h2><p>支持只读 CA 文件挂载；拒绝无效 CA、TLS IP 地址和不支持的 URL 选项；原生 MySQL 运维客户端强制 VERIFY_IDENTITY。</p></section><section><h2>实测</h2><p>真实 MySQL 加密连接成功，错误 CA 和主机名被拒绝；CLI、生产组合连接及 SQL 备份恢复通过。完整回归结果见验收报告。</p></section><section><h2>边界</h2><p>测试数据库和证书均在 Mac 临时生成。公司环境实际联调与 Linux 镜像构建仍待完成。</p></section><a href="04-acceptance-report.md">验收报告</a></html>
