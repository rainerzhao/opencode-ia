services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --ngram_token_size=2
    environment:
      MYSQL_DATABASE: ${WORKBENCH_MYSQL_DATABASE:?WORKBENCH_MYSQL_DATABASE is required}
      MYSQL_USER: ${WORKBENCH_MYSQL_USER:?WORKBENCH_MYSQL_USER is required}
      MYSQL_PASSWORD: ${WORKBENCH_MYSQL_PASSWORD:?WORKBENCH_MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${WORKBENCH_MYSQL_ROOT_PASSWORD:?WORKBENCH_MYSQL_ROOT_PASSWORD is required}
    ports:
      - 127.0.0.1:${WORKBENCH_MYSQL_PORT:-33067}:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    volumes:
      - mysql-local-data:/var/lib/mysql

volumes:
  mysql-local-data:
