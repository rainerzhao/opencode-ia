services:
  workbench:
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      WORKBENCH_DATABASE_URL: ${WORKBENCH_DATABASE_URL:?set WORKBENCH_DATABASE_URL}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-20}
      OPENCODE_CMD: /opt/opencode/bin/opencode
      OPENCODE_CONFIG_FILE: /etc/opencode-workbench/opencode.json
      OPENCODE_VERIFIED_VERSION: ${OPENCODE_VERIFIED_VERSION:?set OPENCODE_VERIFIED_VERSION}
      COOKIE_SECURE: "true"
    volumes:
      - workbench-data:/var/lib/opencode-workbench
      - ${OPENCODE_INSTALL_ROOT:?set OPENCODE_INSTALL_ROOT}:/opt/opencode:ro
      - ${OPENCODE_CONFIG_FILE_HOST:?set OPENCODE_CONFIG_FILE_HOST}:/etc/opencode-workbench/opencode.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  workbench-data:
