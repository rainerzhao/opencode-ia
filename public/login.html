<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>登录 · OpenCode 团队 AI 工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-intro" aria-labelledby="productName">
      <div class="login-brand-mark" aria-hidden="true">OC</div>
      <p class="login-eyebrow">团队统一入口</p>
      <h1 id="productName">OpenCode 团队 AI 工作台</h1>
      <p>围绕 OpenCode 统一组织模型、Agent、Skill 与团队知识资产。每一次操作都有账号归属，个人内容默认私有。</p>
      <ul class="login-points">
        <li>AI 执行统一经过 OpenCode</li>
        <li>服务端会话，不在浏览器保存凭证</li>
        <li>面向内网 Linux 部署设计</li>
      </ul>
    </section>

    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-card-heading">
        <p class="login-eyebrow">欢迎回来</p>
        <h2 id="loginTitle">登录工作台</h2>
        <p>使用管理员分配的团队账号。</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="loginError" role="alert" aria-live="polite"></p>
        <button class="btn btn-primary login-submit" id="loginSubmit" type="submit">登录</button>
      </form>
      <p class="login-footnote">遇到账号问题，请联系工作台管理员。</p>
    </section>
  </main>
  <script src="auth-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
